<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TrackViewer</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TrackViewer">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff">
<style>
  :root {
    --bg: #ffffff; --fg: #1c1c1e; --muted: #6b6b70; --panel: rgba(255,255,255,.94);
    --accent: #e53935; --line: #e2e2e6;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1c1c1e; --fg: #f2f2f7; --muted: #9a9aa0; --panel: rgba(28,28,30,.94); --line: #38383c; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--fg);
    font: 16px/1.3 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column; overflow: hidden;
  }
  header {
    display: flex; align-items: center; gap: 8px;
    padding: calc(env(safe-area-inset-top) + 8px) 12px 8px;
    border-bottom: 1px solid var(--line); background: var(--panel);
  }
  header h1 { font-size: 17px; margin: 0; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  button, select {
    font: inherit; border: 1px solid var(--line); background: var(--bg); color: var(--fg);
    border-radius: 10px; padding: 8px 12px;
  }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 600; }
  #mapwrap { position: relative; flex: 1; min-height: 200px; }
  #map { position: absolute; inset: 0; }
  #empty {
    position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center;
    justify-content: center; text-align: center; padding: 24px; gap: 12px;
    background: var(--bg); z-index: 2;
  }
  #empty.hidden { display: none; }
  #empty p { color: var(--muted); margin: 0; max-width: 320px; }
  #setup { display: none; width: 100%; max-width: 360px; flex-direction: column; gap: 8px; }
  #setup input { font: inherit; padding: 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); }
  #banner {
    position: absolute; top: 10px; left: 10px; right: 10px; z-index: 3; display: none;
    align-items: center; gap: 8px; padding: 8px 8px 8px 12px; border-radius: 12px;
    background: var(--panel); border: 1px solid var(--line); box-shadow: 0 2px 8px rgba(0,0,0,.2); font-size: 14px;
  }
  #banner span { flex: 1; }
  #banner.warn { border-color: var(--accent); color: var(--accent); font-weight: 600; }
  #banner button { padding: 4px 10px; }
  .fab {
    position: absolute; right: 12px; bottom: 20px; z-index: 3; width: 52px; height: 52px;
    border-radius: 50%; padding: 0; display: flex; align-items: center; justify-content: center;
    box-shadow: 0 2px 8px rgba(0,0,0,.3);
  }
  .fab svg { width: 26px; height: 26px; }
  .fab.on { color: #1e66f5; }
  .fab.follow { background: #1e66f5; color: #fff; border-color: #1e66f5; }
  #panel { background: var(--panel); border-top: 1px solid var(--line); padding: 10px 12px calc(env(safe-area-inset-bottom) + 10px); display: none; }
  #stats { display: flex; justify-content: space-between; text-align: center; margin-bottom: 8px; }
  #stats div { flex: 1; }
  #stats b { display: block; font-size: 17px; }
  #stats span { font-size: 12px; color: var(--muted); }
  #chartwrap { position: relative; height: 130px; }
  canvas { width: 100%; height: 100%; touch-action: none; display: block; }
  #tip { position: absolute; top: 0; left: 0; font-size: 12px; color: var(--muted); pointer-events: none; }
</style>
</head>
<body>
<header>
  <select id="maptype" aria-label="Tipo de mapa">
    <option value="roadmap">Mapa</option>
    <option value="hybrid">Satélite</option>
    <option value="terrain">Terreno</option>
  </select>
  <h1 id="title">TrackViewer</h1>
  <button class="primary" id="openBtn">Abrir</button>
  <input type="file" id="file" hidden>
</header>

<div id="mapwrap">
  <div id="map"></div>
  <div id="banner"><span id="bannerTxt"></span><button id="stopBtn" aria-label="Dejar de usar mi ubicación">✕</button></div>
  <button class="fab" id="locBtn" aria-label="Ir a mi ubicación" title="Ir a mi ubicación">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="3.5"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg>
  </button>
  <div id="empty">
    <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 20l5-9 4 6 3-4 6 7z"/><circle cx="17" cy="6" r="2"/></svg>
    <h2 style="margin:0">Sin ruta</h2>
    <p id="emptyMsg">Pulsa «Abrir» y elige un archivo GPX o TCX (o arrástralo aquí en el ordenador).</p>
    <div id="setup">
      <p>Pega tu API key de Google Maps (Maps JavaScript API). Se guarda solo en este navegador.</p>
      <input id="keyInput" placeholder="AIza..." autocapitalize="off" autocorrect="off">
      <button class="primary" id="keyBtn">Guardar y cargar mapa</button>
    </div>
  </div>
</div>

<div id="panel">
  <div id="stats"></div>
  <div id="chartwrap"><canvas id="chart"></canvas><div id="tip"></div></div>
</div>

<script>
// Opcional: pon aquí tu API key para no tener que pegarla en la app.
const API_KEY = "";

// ---------- Utilidades ----------
const $ = id => document.getElementById(id);
const R = 6371000;
function haversine(a, b) {
  const rad = Math.PI / 180;
  const dLat = (b.lat - a.lat) * rad, dLon = (b.lng - a.lng) * rad;
  const s = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * rad) * Math.cos(b.lat * rad) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(s));
}
const txt = (el, tag) => { const n = el.getElementsByTagName(tag)[0]; return n ? n.textContent.trim() : null; };

// ---------- Parser GPX / TCX ----------
function parseTrack(text, fallbackName) {
  const doc = new DOMParser().parseFromString(text, "text/xml");
  if (doc.getElementsByTagName("parsererror").length) throw new Error("El archivo no es un GPX/TCX válido.");
  const pts = [];
  const add = (lat, lng, ele, time) => {
    if (isFinite(lat) && isFinite(lng)) pts.push({ lat, lng, ele: isFinite(ele) ? ele : null, time: time ? new Date(time) : null });
  };
  let name = null;
  const gpxPts = doc.querySelectorAll("trkpt, rtept");
  if (gpxPts.length) {
    gpxPts.forEach(p => add(parseFloat(p.getAttribute("lat")), parseFloat(p.getAttribute("lon")),
      parseFloat(txt(p, "ele")), txt(p, "time")));
    const trk = doc.getElementsByTagName("trk")[0] || doc.getElementsByTagName("rte")[0];
    name = (trk && txt(trk, "name")) || txt(doc.documentElement, "name");
  } else {
    doc.querySelectorAll("Trackpoint").forEach(p => add(
      parseFloat(txt(p, "LatitudeDegrees")), parseFloat(txt(p, "LongitudeDegrees")),
      parseFloat(txt(p, "AltitudeMeters")), txt(p, "Time")));
    name = txt(doc, "Id");
  }
  if (pts.length < 2) throw new Error("El archivo no contiene puntos de track.");
  return buildTrack(name || fallbackName, pts);
}

function buildTrack(name, points) {
  const cum = [0];
  for (let i = 1; i < points.length; i++) cum.push(cum[i - 1] + haversine(points[i - 1], points[i]));
  let up = 0, down = 0, ref = null;
  for (const p of points) {
    if (p.ele == null) continue;
    if (ref == null) { ref = p.ele; continue; }
    const d = p.ele - ref;
    if (Math.abs(d) >= 3) { d > 0 ? up += d : down -= d; ref = p.ele; }  // umbral 3 m
  }
  const eles = points.map(p => p.ele).filter(e => e != null);
  const times = points.map(p => p.time).filter(Boolean);
  const duration = times.length > 1 && times.at(-1) > times[0] ? (times.at(-1) - times[0]) / 1000 : null;
  return { name, points, cum, total: cum.at(-1), up, down,
    min: eles.length ? Math.min(...eles) : null, max: eles.length ? Math.max(...eles) : null, duration };
}

// ---------- Mapa ----------
let map, polyline, outline, startM, endM, hoverM, mapReady = false, current = null;

function loadMaps(key) {
  if (window.google && google.maps) return initMap();
  const s = document.createElement("script");
  s.src = `https://maps.googleapis.com/maps/api/js?key=${encodeURIComponent(key)}&callback=initMap&loading=async`;
  s.async = true;
  s.onerror = () => showEmpty("No se pudo cargar Google Maps. ¿Tienes conexión y la API key es correcta?");
  document.head.appendChild(s);
}
window.initMap = function () {
  map = new google.maps.Map($("map"), {
    center: { lat: 40, lng: -3.7 }, zoom: 5, mapTypeId: $("maptype").value,
    mapTypeControl: false, streetViewControl: false, fullscreenControl: false, gestureHandling: "greedy",
    zoomControlOptions: { position: google.maps.ControlPosition.LEFT_BOTTOM }
  });
  mapReady = true;
  // Si el usuario mueve el mapa con el dedo, dejamos de seguirle (como Google Maps)
  map.addListener("dragstart", () => { if (following) { following = false; updateFab(); } });
  if (current) drawTrack(current);
};
window.gm_authFailure = () => showEmpty("Google rechazó la API key. Revisa que Maps JavaScript API esté habilitada y la restricción de dominio.");

function drawTrack(t) {
  if (!mapReady) return;
  [polyline, outline, startM, endM, hoverM].forEach(o => o && o.setMap(null));
  hoverM = null;
  const path = t.points.map(p => ({ lat: p.lat, lng: p.lng }));
  outline = new google.maps.Polyline({ path, strokeColor: "#fff", strokeWeight: 8, map });
  polyline = new google.maps.Polyline({ path, strokeColor: "#e53935", strokeWeight: 5, map });
  const dot = color => ({ path: google.maps.SymbolPath.CIRCLE, scale: 8, fillColor: color, fillOpacity: 1, strokeColor: "#fff", strokeWeight: 2 });
  startM = new google.maps.Marker({ position: path[0], map, icon: dot("#2e9e4f"), title: "Inicio" });
  endM = new google.maps.Marker({ position: path.at(-1), map, icon: dot("#111"), title: "Fin" });
  const b = new google.maps.LatLngBounds();
  path.forEach(p => b.extend(p));
  map.fitBounds(b, 50);
}

function setHover(i) {
  if (!mapReady || !current) return;
  const p = current.points[i];
  const pos = { lat: p.lat, lng: p.lng };
  if (!hoverM) hoverM = new google.maps.Marker({
    position: pos, map, zIndex: 99,
    icon: { path: google.maps.SymbolPath.CIRCLE, scale: 9, fillColor: "#f59e0b", fillOpacity: 1, strokeColor: "#fff", strokeWeight: 3 }
  });
  else hoverM.setPosition(pos);
}
function clearHover() { if (hoverM) { hoverM.setMap(null); hoverM = null; } }

$("maptype").addEventListener("change", e => map && map.setMapTypeId(e.target.value));

// ---------- UI ----------
function showEmpty(msg) {
  $("empty").classList.remove("hidden");
  $("emptyMsg").textContent = msg;
}
function fmtDur(s) {
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60);
  return h ? `${h} h ${m} min` : `${m} min`;
}
function renderStats(t) {
  const items = [[(t.total / 1000).toFixed(2) + " km", "Distancia"], ["+" + Math.round(t.up) + " m", "Desnivel +"], ["−" + Math.round(t.down) + " m", "Desnivel −"]];
  if (t.duration) items.push([fmtDur(t.duration), "Tiempo"]);
  $("stats").innerHTML = items.map(([v, l]) => `<div><b>${v}</b><span>${l}</span></div>`).join("");
}

function showTrack(t) {
  current = t;
  $("title").textContent = t.name;
  $("empty").classList.add("hidden");
  $("panel").style.display = "block";
  $("chartwrap").style.display = t.max != null ? "block" : "none";
  renderStats(t);
  drawTrack(t);
  requestAnimationFrame(() => drawChart());
  updateStatus();
}

async function handleFile(file) {
  try {
    const text = await file.text();
    const t = parseTrack(text, file.name.replace(/\.[^.]+$/, ""));
    showTrack(t);
  } catch (e) {
    alert(e.message || e);
  }
}
$("openBtn").onclick = () => $("file").click();
$("file").onchange = e => { if (e.target.files[0]) handleFile(e.target.files[0]); e.target.value = ""; };
addEventListener("dragover", e => e.preventDefault());
addEventListener("drop", e => { e.preventDefault(); if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]); });

// ---------- Perfil de elevación ----------
const canvas = $("chart"), ctx = canvas.getContext("2d");
let hoverIdx = null;
const pad = { l: 38, r: 8, t: 14, b: 18 };

function css(v) { return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }

function drawChart() {
  if (!current || current.max == null) return;
  const dpr = devicePixelRatio || 1;
  const w = canvas.clientWidth, h = canvas.clientHeight;
  canvas.width = w * dpr; canvas.height = h * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);
  const t = current;
  const lo = t.min, hi = t.max === t.min ? t.min + 1 : t.max;
  const X = d => pad.l + (d / t.total) * (w - pad.l - pad.r);
  const Y = e => h - pad.b - ((e - lo) / (hi - lo)) * (h - pad.t - pad.b);

  // ejes
  ctx.font = "11px -apple-system, sans-serif";
  ctx.fillStyle = css("--muted"); ctx.strokeStyle = css("--line"); ctx.lineWidth = 1;
  for (let k = 0; k <= 2; k++) {
    const e = lo + (hi - lo) * k / 2, y = Y(e);
    ctx.beginPath(); ctx.moveTo(pad.l, y); ctx.lineTo(w - pad.r, y); ctx.stroke();
    ctx.textAlign = "right"; ctx.fillText(Math.round(e) + " m", pad.l - 4, y + 4);
  }
  ctx.textAlign = "center";
  const kmTotal = t.total / 1000, step = kmTotal > 40 ? 10 : kmTotal > 15 ? 5 : kmTotal > 6 ? 2 : 1;
  for (let km = 0; km <= kmTotal; km += step) ctx.fillText(km + " km", Math.min(Math.max(X(km * 1000), 14), w - 14), h - 3);

  // área + línea (se omiten los puntos sin altitud)
  const step2 = Math.max(1, Math.floor(t.points.length / 600));
  ctx.beginPath(); let first = true, lastX = pad.l;
  for (let i = 0; i < t.points.length; i += step2) {
    const e = t.points[i].ele; if (e == null) continue;
    const x = X(t.cum[i]), y = Y(e);
    first ? ctx.moveTo(x, y) : ctx.lineTo(x, y); first = false; lastX = x;
  }
  ctx.strokeStyle = "#e53935"; ctx.lineWidth = 2; ctx.stroke();
  ctx.lineTo(lastX, h - pad.b); ctx.lineTo(pad.l, h - pad.b); ctx.closePath();
  ctx.fillStyle = "rgba(229,57,53,.2)"; ctx.fill();

  // mi posición actual (línea azul discontinua)
  if (meIdx != null) {
    const x = X(t.cum[meIdx]), e = t.points[meIdx].ele;
    ctx.strokeStyle = "#1e66f5"; ctx.lineWidth = 1.5; ctx.setLineDash([4, 3]);
    ctx.beginPath(); ctx.moveTo(x, pad.t); ctx.lineTo(x, h - pad.b); ctx.stroke(); ctx.setLineDash([]);
    if (e != null) { ctx.fillStyle = "#1e66f5"; ctx.beginPath(); ctx.arc(x, Y(e), 5, 0, 7); ctx.fill(); }
  }

  // cursor (al arrastrar el dedo)
  if (hoverIdx != null) {
    const p = t.points[hoverIdx], x = X(t.cum[hoverIdx]);
    ctx.strokeStyle = "#f59e0b"; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(x, pad.t); ctx.lineTo(x, h - pad.b); ctx.stroke();
    if (p.ele != null) { ctx.fillStyle = "#f59e0b"; ctx.beginPath(); ctx.arc(x, Y(p.ele), 4, 0, 7); ctx.fill(); }
  }
}

function indexAt(dist) {
  const c = current.cum; let lo = 0, hi = c.length - 1;
  while (lo < hi) { const m = (lo + hi) >> 1; c[m] < dist ? lo = m + 1 : hi = m; }
  return lo;
}
function onPointer(e) {
  if (!current) return;
  const rect = canvas.getBoundingClientRect();
  const frac = Math.min(1, Math.max(0, (e.clientX - rect.left - pad.l) / (rect.width - pad.l - pad.r)));
  hoverIdx = indexAt(frac * current.total);
  const p = current.points[hoverIdx];
  $("tip").textContent = `${(current.cum[hoverIdx] / 1000).toFixed(2)} km` + (p.ele != null ? ` · ${Math.round(p.ele)} m` : "");
  setHover(hoverIdx); drawChart();
}
function endPointer() { hoverIdx = null; $("tip").textContent = ""; clearHover(); drawChart(); }
canvas.addEventListener("pointerdown", e => { canvas.setPointerCapture(e.pointerId); onPointer(e); });
canvas.addEventListener("pointermove", e => { if (e.buttons || e.pointerType === "mouse") onPointer(e); });
canvas.addEventListener("pointerup", endPointer);
canvas.addEventListener("pointerleave", e => { if (e.pointerType === "mouse") endPointer(); });
addEventListener("resize", drawChart);

// ---------- Mi ubicación ----------
let watchId = null, meM = null, meCircle = null, following = false, firstFix = false;
let lastFix = null, wakeLock = null, meIdx = null;
const fab = $("locBtn");

function setBanner(msg, warn) {
  $("bannerTxt").textContent = msg || "";
  $("banner").style.display = msg ? "flex" : "none";
  $("banner").classList.toggle("warn", !!warn);
}
function updateFab() {
  fab.classList.toggle("on", watchId != null);
  fab.classList.toggle("follow", watchId != null && following);
}
function fmtDist(m) { return m < 1000 ? Math.round(m) + " m" : (m / 1000).toFixed(2) + " km"; }

// Punto más cercano de la ruta (proyección sobre cada tramo, en metros planos)
function nearestOnTrack(lat, lng) {
  const t = current; if (!t) return null;
  const M = 111320, k = Math.cos(lat * Math.PI / 180);
  let best = Infinity, bestIdx = 0, bestAlong = 0;
  for (let i = 0; i < t.points.length - 1; i++) {
    const a = t.points[i], b = t.points[i + 1];
    const ax = (a.lng - lng) * k * M, ay = (a.lat - lat) * M;
    const dx = (b.lng - lng) * k * M - ax, dy = (b.lat - lat) * M - ay;
    const len2 = dx * dx + dy * dy;
    const u = len2 ? Math.max(0, Math.min(1, -(ax * dx + ay * dy) / len2)) : 0;
    const d = Math.hypot(ax + u * dx, ay + u * dy);
    if (d < best) {
      best = d; bestIdx = u > 0.5 ? i + 1 : i;
      bestAlong = t.cum[i] + u * (t.cum[i + 1] - t.cum[i]);
    }
  }
  return { dist: best, idx: bestIdx, along: bestAlong };
}

function updateStatus() {
  if (watchId == null || !lastFix) return;
  let msg, warn = false;
  if (current) {
    const r = nearestOnTrack(lastFix.lat, lastFix.lng);
    meIdx = r.idx;
    if (r.dist <= Math.max(30, lastFix.acc)) {
      msg = `En la ruta · km ${(r.along / 1000).toFixed(2)} de ${(current.total / 1000).toFixed(2)}`;
    } else { msg = `Fuera de ruta · a ${fmtDist(r.dist)}`; warn = true; }
  } else { meIdx = null; msg = "Ubicación activa"; }
  msg += ` · ±${Math.round(lastFix.acc)} m`;
  if (lastFix.acc > 100) msg += " (señal débil)";
  setBanner(msg, warn);
  drawChart();
}

function onFix(pos) {
  if (!mapReady) return;
  const { latitude: lat, longitude: lng, accuracy } = pos.coords;
  lastFix = { lat, lng, acc: accuracy };
  const ll = { lat, lng };
  if (!meM) {
    meM = new google.maps.Marker({
      position: ll, map, zIndex: 200, clickable: false, title: "Mi ubicación",
      icon: { path: google.maps.SymbolPath.CIRCLE, scale: 10, fillColor: "#1e66f5", fillOpacity: 1, strokeColor: "#fff", strokeWeight: 3 }
    });
    meCircle = new google.maps.Circle({
      center: ll, radius: accuracy, map, clickable: false,
      strokeWeight: 0, fillColor: "#1e66f5", fillOpacity: 0.15
    });
  } else {
    meM.setPosition(ll); meCircle.setCenter(ll); meCircle.setRadius(accuracy);
  }
  if (firstFix) {
    firstFix = false;
    map.setZoom(Math.max(map.getZoom() || 0, 16));
    map.panTo(ll);
  } else if (following) {
    map.panTo(ll);
  }
  updateStatus();
}

function onGeoError(err) {
  if (err.code === 1) {
    stopLocating();
    setBanner("Permiso de ubicación denegado. En el iPhone: Ajustes → Privacidad y seguridad → Localización → Safari (y permite el acceso).", true);
  } else if (err.code === 2) {
    setBanner("No se puede obtener la ubicación (sin señal GPS).", true);
  } else {
    setBanner("Buscando señal GPS…");
  }
}

async function requestWake() {
  try { if ("wakeLock" in navigator && watchId != null) wakeLock = await navigator.wakeLock.request("screen"); } catch (e) {}
}
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && watchId != null) requestWake(); });

function startLocating() {
  if (!navigator.geolocation) { setBanner("Este navegador no permite usar la ubicación.", true); return; }
  if (!mapReady) { setBanner("El mapa aún no está cargado: guarda primero tu API key.", true); return; }
  firstFix = true; following = true;
  setBanner("Buscando ubicación…");
  watchId = navigator.geolocation.watchPosition(onFix, onGeoError, { enableHighAccuracy: true, maximumAge: 2000, timeout: 20000 });
  requestWake(); updateFab();
}

function stopLocating() {
  if (watchId != null) navigator.geolocation.clearWatch(watchId);
  watchId = null; following = false; lastFix = null; meIdx = null;
  [meM, meCircle].forEach(o => o && o.setMap(null)); meM = meCircle = null;
  try { wakeLock && wakeLock.release(); } catch (e) {} wakeLock = null;
  setBanner(""); updateFab(); drawChart();
}

fab.onclick = () => {
  if (watchId == null) return startLocating();
  following = true;                       // ya activo: volver a centrar y seguir
  if (lastFix) { map.panTo(lastFix); if (map.getZoom() < 15) map.setZoom(16); }
  updateFab();
};
$("stopBtn").onclick = stopLocating;

// ---------- Arranque ----------
const savedKey = API_KEY || localStorage.getItem("gmaps_key") || "";
if (savedKey) loadMaps(savedKey);
else { $("setup").style.display = "flex"; }
$("keyBtn").onclick = () => {
  const k = $("keyInput").value.trim();
  if (!k) return;
  localStorage.setItem("gmaps_key", k);
  $("setup").style.display = "none";
  loadMaps(k);
};
if (savedKey) $("setup").style.display = "none";

if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
</script>
</body>
</html>
